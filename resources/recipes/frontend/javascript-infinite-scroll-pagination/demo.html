<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite Scroll Demo</title>
<style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; background: #0f172a; color: #e2e8f0; }
    .post-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .post-card h3 { margin: 0 0 .5rem; color: #22d3ee; }
    .post-card p { margin: 0; color: #94a3b8; }
    .scroll-loader, .scroll-error, .scroll-end { text-align: center; padding: 1rem; color: #94a3b8; }
    .scroll-error { color: #f97316; }
    #sentinel { height: 1px; }
</style>
</head>
<body>
<h1>Infinite Scroll Demo</h1>
<div id="list"></div>
<div id="sentinel"></div>

<script type="module">
    import { InfiniteScroll } from "./infinite_scroll.js";

    const scroll = new InfiniteScroll({
        container: document.getElementById("list"),
        sentinel: document.getElementById("sentinel"),
        fetchUrl: "/api/posts",
        renderItem: (post) => {
            const div = document.createElement("div");
            div.className = "post-card";
            const h3 = document.createElement("h3");
            h3.textContent = post.title;
            const p = document.createElement("p");
            p.textContent = post.excerpt;
            div.append(h3, p);
            return div;
        },
        pageSize: 12,
        threshold: 200
    });

    scroll.init();
    window.addEventListener("beforeunload", () => scroll.destroy());
</script>
</body>
</html>
