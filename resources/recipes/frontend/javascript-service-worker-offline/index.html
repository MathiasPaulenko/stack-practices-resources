<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Worker Offline Demo</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <main>
        <h1>Service Worker Offline Demo</h1>
        <p>
            Companion code for the
            <a href="https://stackpractices.com/recipes/javascript-service-worker-offline/">StackPractices recipe</a>.
            Turn on airplane mode (or DevTools &rarr; Network &rarr; Offline), submit the
            form, then go back online: the queued entry replays through Background Sync.
        </p>

        <p id="status">Connection: <strong>checking…</strong></p>

        <form id="demo-form">
            <label>
                Name
                <input name="name" required>
            </label>
            <label>
                Message
                <textarea name="message" rows="3" required></textarea>
            </label>
            <button type="submit">Submit</button>
        </form>

        <h2>Queued submissions</h2>
        <ul id="queue"></ul>
    </main>

    <script src="/db.js"></script>
    <script src="/main.js"></script>
</body>
</html>
