<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; color: #1e293b; }
        a { color: #0284c7; }
    </style>
</head>
<body>
    <h1>You are offline</h1>
    <p>This page lives in the service worker cache, so it renders without a connection. Anything you submitted is queued locally and replays when the network returns.</p>
    <p><a href="/">Try again</a></p>
</body>
</html>
