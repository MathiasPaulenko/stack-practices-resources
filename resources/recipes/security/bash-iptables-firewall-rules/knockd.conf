# Requires knockd: apt install knockd
# Copy to /etc/knockd.conf, then: systemctl enable --now knockd
# Client: knock -v server-ip 7000 8000 9000 && ssh user@server-ip

[openSSH]
    sequence    = 7000,8000,9000
    seq_timeout = 15
    tcpflags    = syn
    start_command = iptables -A INPUT -s %IP% -p tcp --dport 22 -j ACCEPT
    cmd_timeout   = 30
    stop_command  = iptables -D INPUT -s %IP% -p tcp --dport 22 -j ACCEPT

[closeSSH]
    sequence    = 9000,8000,7000
    seq_timeout = 15
    tcpflags    = syn
    start_command = iptables -D INPUT -s %IP% -p tcp --dport 22 -j ACCEPT
