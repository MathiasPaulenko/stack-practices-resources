#!/usr/sbin/nft -f
# nftables equivalent of the baseline ruleset — one inet table covers IPv4+IPv6.
# Apply with: nft -f nftables.conf && systemctl enable --now nftables
# To translate an existing ruleset instead:
#   iptables-restore-translate -f /etc/iptables/rules.v4 > /etc/nftables.conf

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # ICMP on both families — echo-request only, rate-limited
        icmp type echo-request limit rate 1/second accept
        icmpv6 type echo-request limit rate 1/second accept

        tcp dport 22 ct state new limit rate 4/minute accept
        tcp dport { 80, 443 } accept

        limit rate 5/minute log prefix "nft-DROP: " level warn
        drop
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
