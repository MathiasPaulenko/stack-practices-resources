# Nginx caching config — static assets, API conditional caching, proxy_cache layer.
# Drop into conf.d/ or include from the server block. Test with: nginx -t

# Shared cache zone (10 GB metadata for 100m of keys, 1 GB of responses)
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=app_cache:100m max_size=1g
                 inactive=60m use_temp_path=off;

server {
    listen 80;
    server_name example.com;

    # Fingerprinted static assets: cache aggressively, never revalidate
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # Semi-live API: short TTL + stale-while-revalidate for browsers
    location /api/ {
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300";
    }

    # Public API: edge-like cache at the reverse proxy layer
    location /api/public/ {
        proxy_cache app_cache;
        proxy_cache_valid 200 5m;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
        proxy_pass http://app_upstream;
    }
}
