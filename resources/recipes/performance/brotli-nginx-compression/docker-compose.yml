# docker-compose.yml
# Nginx with Brotli compression serving static assets
version: "3.9"

services:
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/var/www/html:ro
    restart: unless-stopped
