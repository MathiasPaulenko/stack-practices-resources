# /etc/nginx/nginx.conf
# Brotli + Gzip configuration for static assets

load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

http {
  # Brotli dynamic compression
  brotli on;
  brotli_comp_level 6;
  brotli_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

  # Serve pre-built .br files when they exist
  brotli_static on;
  brotli_vary on;

  # Gzip fallback for older browsers
  gzip on;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_vary on;
  gzip_min_length 256;

  server {
    listen 80;
    server_name example.com;
    root /var/www/html;

    location / {
      try_files $uri $uri/ =404;
    }

    # Cache pre-compressed assets for 1 year
    location ~* \.(js|css|svg|html)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
