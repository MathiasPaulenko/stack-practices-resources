# fluent.conf — accept forwarded logs, parse JSON, ship to Elasticsearch
<source>
  @type forward
  port 24224
</source>

<filter app.**>
  @type parser
  format json
  key_name log
</filter>

<match app.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix app
  <buffer>
    @type file
    path /var/log/fluentd-buffer
    flush_interval 5s
    chunk_limit_size 2M
    total_limit_size 512M
    retry_max_times 10
    retry_exponential_backoff_base 2s
  </buffer>
</match>
