replicaCount: 2

image:
  tag: "2.5.0-rc1"

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: my-app.staging.example.com
      paths:
        - path: /
          pathType: Prefix

config:
  LOG_LEVEL: debug
  DATABASE_URL: "postgres://staging-db:5432/myapp"
