# fluentd-s3.conf — forward docker.** events to AWS S3 for long-term archive.
# Requires fluent-plugin-s3. Credentials come from env vars or an IAM role.

<source>
    @type forward
    port 24224
    bind 0.0.0.0
</source>

<match docker.**>
    @type s3
    aws_key_id "#{ENV['AWS_ACCESS_KEY_ID']}"
    aws_sec_key "#{ENV['AWS_SECRET_ACCESS_KEY']}"
    s3_bucket my-log-bucket
    s3_region us-east-1
    path logs/
    buffer_path /var/log/fluent/s3
    time_slice_format %Y%m%d
    time_slice_wait 10m
    flush_interval 30s
</match>
