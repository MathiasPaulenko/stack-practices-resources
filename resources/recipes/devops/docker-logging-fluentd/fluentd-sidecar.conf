# fluentd-sidecar.conf — tail application log files via shared volume.
# pos_file persists the read offset so restarts resume where they stopped.

<source>
    @type tail
    path /var/log/app/app.log
    pos_file /var/log/app/app.log.pos
    tag app.api
    <parse>
        @type json
        time_key timestamp
        time_format %Y-%m-%dT%H:%M:%S.%LZ
    </parse>
</source>

<match app.**>
    @type elasticsearch
    host elasticsearch
    port 9200
    index_name app-logs-%Y%m%d
    flush_interval 5s
</match>
