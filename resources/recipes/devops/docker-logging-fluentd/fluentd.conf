# fluentd.conf — Docker fluentd driver input, enrich + parse, fan-out to ES and stdout.
# Mount: docker run -v $(pwd)/fluentd.conf:/fluentd/etc/fluent.conf fluent/fluentd:v1.16

<source>
    @type forward
    port 24224
    bind 0.0.0.0
</source>

<filter docker.**>
    @type record_transformer
    <record>
        hostname ${hostname}
        source "docker"
    </record>
</filter>

<filter docker.**>
    @type parser
    key_name log
    reserve_data true
    <parse>
        @type json
    </parse>
</filter>

# Each event goes to the FIRST matching <match> — fan out with @type copy.
<match docker.**>
    @type copy
    <store>
        @type elasticsearch
        host elasticsearch
        port 9200
        index_name docker-logs-%Y%m%d
        type_name _doc
        flush_interval 5s
    </store>
    <store>
        @type stdout
    </store>
</match>
