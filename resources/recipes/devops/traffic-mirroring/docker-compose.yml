version: "3.9"

services:
  production:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - staging

  staging:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  goreplay:
    image: buger/goreplay:latest
    network_mode: host
    command: --input-raw :8080 --output-http http://staging:80
    depends_on:
      - production
      - staging
