upstream production_backend {
    server production:8080;
}

upstream staging_backend {
    server staging:8080;
}

server {
    listen 80;
    server_name api.example.com;

    location /api/ {
        mirror /staging_mirror;
        mirror_request_body on;

        proxy_pass http://production_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /staging_mirror {
        internal;
        proxy_pass http://staging_backend$request_uri;
        proxy_set_header Host staging-api.example.com;
        proxy_set_header X-Mirrored-From $host;

        # Do not block production on staging response
        proxy_connect_timeout 1s;
        proxy_read_timeout 1s;
        proxy_ignore_client_abort on;
    }

    # Filter out health checks and static assets
    location /health {
        proxy_pass http://production_backend;
        # No mirror for health checks
    }

    location /static/ {
        proxy_pass http://production_backend;
        # No mirror for static assets
    }
}
