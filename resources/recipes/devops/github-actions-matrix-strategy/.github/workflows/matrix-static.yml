name: Matrix — static

on: [push, pull_request]

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ["18", "20", "22"]
        exclude:
          # Node 18 is EOL on macOS runners in our fleet
          - os: macos-latest
            node-version: "18"
        include:
          # Coverage only once: on the primary platform and latest LTS
          - os: ubuntu-latest
            node-version: "22"
            coverage: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          # Key the cache per cell or OSes poison each other's native modules
          cache-dependency-path: package-lock.json
      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-${{ hashFiles('**/package-lock.json') }}
      - run: npm ci
      - run: npm test
      - name: Run coverage
        if: ${{ matrix.coverage }}
        run: npm run test:coverage
