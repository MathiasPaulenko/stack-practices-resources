# /etc/logrotate.d/myapp
/var/log/myapp/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    dateext
    dateformat -%Y%m%d-%H%M%S
    sharedscripts
    create 0644 myapp myapp
    postrotate
        # Runs ONCE for the whole block thanks to sharedscripts
        if [ -f /var/run/myapp.pid ]; then
            kill -HUP "$(cat /var/run/myapp.pid)"
        else
            systemctl reload myapp
        fi
    endscript
}
