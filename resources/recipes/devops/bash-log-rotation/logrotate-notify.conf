# /etc/logrotate.d/myapp-notify
# Requires mailutils (Debian) or mailx (RHEL) — postrotate runs once
# thanks to sharedscripts, so you get one email, not one per log file
/var/log/myapp/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    create 0644 myapp myapp
    postrotate
        systemctl reload myapp
        echo "Log rotated on $(hostname) at $(date)" | \
            mail -s "Log rotation: myapp" ops@example.com
    endscript
}
