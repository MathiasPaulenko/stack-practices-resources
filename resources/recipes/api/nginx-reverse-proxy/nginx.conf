# Nginx reverse proxy + API gateway — companion config
# Companion for https://stackpractices.com/recipes/nginx-reverse-proxy/
# Mount this file into the nginx container (see docker-compose.yml).

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # --- Rate limiting zone: 10 requests/second per client IP ---
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

  # --- Upstream pool: two primaries + one backup ---
  upstream api_backend {
    least_conn;

    server backend1:3000;
    server backend2:3000;
    server backend3:3000 backup;

    keepalive 32;
  }

  # Hide the Nginx version from response headers
  server_tokens off;

  # Access log with upstream timing
  log_format upstream '$remote_addr - $request_time $upstream_response_time $status';
  access_log /var/log/nginx/access.log upstream;

  server {
    listen 80;
    server_name _;

    # Health check served by Nginx itself (no proxy)
    location /health {
      return 200 'ok';
    }

    # Rate-limited API traffic -> upstream pool
    location /api/ {
      limit_req zone=api_limit burst=20 nodelay;
      limit_req_status 429;

      proxy_pass http://api_backend/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
    }

    # Path-based routing to a dedicated service
    location /api/users/ {
      proxy_pass http://backend1:3000/;
      proxy_set_header Host $host;
    }
  }
}
