# Example TOML configuration file for parse-toml-files recipe

[app]
name = "myapp"
version = "2.1.0"
debug = false

[database]
host = "localhost"
port = 5432
pool_size = 10

[database.server]
host = "localhost"
port = 5432

features = ["auth", "logging", "metrics"]

[[servers]]
name = "web-1"
ip = "10.0.0.1"
port = 8080

[[servers]]
name = "web-2"
ip = "10.0.0.2"
port = 8080

[[servers]]
name = "db-1"
ip = "10.0.0.10"
port = 5432

# Dates and times (ISO 8601)
started = 2026-08-13T07:30:00Z
expires = 2026-08-13
daily = 07:30:00
