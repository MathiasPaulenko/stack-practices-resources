app:
  name: myapp
  version: "1.10"
  debug: false

database:
  host: localhost
  port: 5432
  pool_size: 10

defaults: &defaults
  timeout: 30
  retries: 3
  log_level: info

production:
  <<: *defaults
  log_level: warn
  retries: 5

staging:
  <<: *defaults
  log_level: debug

features: [auth, logging, metrics]
