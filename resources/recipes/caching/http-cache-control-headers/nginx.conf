# nginx.conf — HTTP Cache-Control headers for static assets and API responses
# Companion to https://stackpractices.com/recipes/http-cache-control-headers/

server {
    listen 80;
    server_name example.com;

    root /var/www/app;

    # Static assets with content hashes in filenames — cache for a year.
    # The `immutable` flag tells browsers to never revalidate; the filename
    # changes when the content changes (e.g., app.abc123.js).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML entry points — must reflect every deploy, so force revalidation.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Public API responses — short freshness window, then stale while the
    # CDN (or any shared cache in front) revalidates in the background.
    location /api/products {
        proxy_pass http://localhost:3000;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300";
    }

    # Authenticated endpoints — never store in shared caches.
    location /api/users/me {
        proxy_pass http://localhost:3000;
        add_header Cache-Control "private, no-cache";
    }

    # Billing and other sensitive data — nothing stored anywhere.
    location /api/user/billing {
        proxy_pass http://localhost:3000;
        add_header Cache-Control "no-store";
    }
}
