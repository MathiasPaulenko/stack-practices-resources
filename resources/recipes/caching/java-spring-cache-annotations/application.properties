# Redis connection (defaults shown — adjust for your environment)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000

# Type shown in logs so you can confirm the manager in use
spring.cache.type=redis

# In-memory H2 so the JPA repository stub runs without a real database
spring.datasource.url=jdbc:h2:mem:cache-demo
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
