# Companion config for https://stackpractices.com/recipes/nginx-reverse-proxy-cache/
# Run with: docker compose up -d  (see docker-compose.yml)
# Requires Nginx built with ngx_cache_purge, or drop the /purge location.

events {
    worker_connections 1024;
}

http {
    # Cache zone: keys in shared memory, bodies on disk
    proxy_cache_path /var/cache/nginx/api
        levels=1:2
        keys_zone=api_cache:10m
        max_size=1g
        inactive=60m
        use_temp_path=off;

    upstream backend {
        server app1:3000;
        server app2:3000;
    }

    server {
        listen 80;
        server_name api.localhost;

        # Bypass cache for non-GET, authenticated requests, or ?no_cache=1
        set $skip_cache 0;
        if ($request_method != GET) {
            set $skip_cache 1;
        }
        if ($http_authorization) {
            set $skip_cache 1;
        }
        if ($args ~* "no_cache=1") {
            set $skip_cache 1;
        }

        location /api/ {
            proxy_pass http://backend;
            proxy_cache api_cache;
            proxy_cache_key "$request_method$request_uri";

            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_valid 500 10s;

            proxy_no_cache $skip_cache;
            proxy_cache_bypass $skip_cache;

            # Stampede protection + stale-while-revalidate
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_background_update on;
            proxy_cache_revalidate on;

            add_header X-Cache-Status $upstream_cache_status;
        }

        # Targeted purge — requires ngx_cache_purge or NGINX Plus
        location ~ /purge(/.*) {
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            deny all;
            proxy_cache_purge api_cache "$request_method$1$is_args$args";
        }
    }
}
