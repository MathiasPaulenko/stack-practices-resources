# Spring Boot + Caffeine — declarative spec alternative to CacheConfig.java
# Provider selection (optional; auto-detected when caffeine is on the classpath)
spring.cache.type=caffeine
# Caffeine spec applied to all caches created by the auto-configured manager
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=600s,recordStats
# Named caches (comma-separated); when omitted, caches are created on demand
spring.cache.cache-names=users,products,config
