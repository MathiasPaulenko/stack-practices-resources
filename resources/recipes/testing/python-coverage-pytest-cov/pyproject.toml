[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sample-coverage-app"
version = "0.1.0"
description = "Sample project for pytest-cov recipe"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
]
dev = [
    "diff-cover>=8.0",
    "coverage-badge>=1.1",
]

[tool.pytest.ini_options]
addopts = "--cov=sample_app --cov-report=term-missing --cov-report=html --cov-report=xml --cov-branch"
testpaths = ["tests"]

[tool.coverage.run]
source = ["sample_app"]
branch = true
parallel = false
omit = [
    "sample_app/__init__.py",
    "sample_app/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
