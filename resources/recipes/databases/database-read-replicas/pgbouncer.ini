; PgBouncer configuration for read/write splitting with replicas.
; Place in /etc/pgbouncer/pgbouncer.ini

[databases]
master = host=master.db.internal port=5432 dbname=app
replica1 = host=replica1.db.internal port=5432 dbname=app
replica2 = host=replica2.db.internal port=5432 dbname=app

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 25
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
admin_users = pgbouncer
