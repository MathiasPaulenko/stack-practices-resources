version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: soft_deletes_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_pass
    ports:
      - "5432:5432"
    volumes:
      - ./sql_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d soft_deletes_demo"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
