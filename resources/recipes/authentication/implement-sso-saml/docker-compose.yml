# Test Identity Provider for the SAML demo.
# Keycloak starts in dev mode; create a realm named "saml-demo" and add a
# SAML client pointing at https://localhost:5000/saml/acs.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
