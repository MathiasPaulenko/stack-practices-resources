[databases]
mydb = host=mydb.abc123.us-east-1.rds.amazonaws.com port=5432 dbname=mydb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; transaction pooling: server connection returns to the pool after each tx.
; Required for Lambda reuse — session pooling would pin connections.
pool_mode = transaction
max_client_conn = 10000
default_pool_size = 50
reserve_pool_size = 10
ignore_startup_parameters = extra_float_digits
