# Marquez — OpenLineage reference backend
# Run: docker compose up -d
# API: http://localhost:5000  UI: http://localhost:3000
version: "3.8"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    ports:
      - "5432:5432"
    volumes:
      - marquez-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marquez"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: marquezproject/marquez:0.50.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      MARQUEZ_DB_HOST: db
      MARQUEZ_DB_PORT: 5432
      MARQUEZ_DB_NAME: marquez
      MARQUEZ_DB_USER: marquez
      MARQUEZ_DB_PASSWORD: marquez
      # Run migrations on boot, then serve the API
      MARQUEZ_DB_MIGRATE: "true"
    ports:
      - "5000:5000"   # REST API (namespace/job/run/lineage endpoints)
      - "5001:5001"   # admin interface
    entrypoint: ["./entrypoint.sh", "db", "migrate"]

  web:
    image: marquezproject/marquez-web:0.50.0
    depends_on:
      - api
    environment:
      MARQUEZ_HOST: api
      MARQUEZ_PORT: 5000
    ports:
      - "3000:3000"   # lineage graph UI

volumes:
  marquez-db:
