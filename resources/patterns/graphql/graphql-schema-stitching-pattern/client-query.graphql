# client-query.graphql — one request, two services
# Companion to https://stackpractices.com/patterns/graphql-schema-stitching-pattern/
#
# Run against the stitched gateway (:4000):
#   curl -s http://localhost:4000/graphql \
#     -H 'content-type: application/json' \
#     -d '{"query":"{ user(id: \"1\") { name email posts { title body author { name } } } }"}'

query UserWithPosts {
  user(id: "1") {
    name
    email
    posts {
      title
      body
      author {
        name
      }
    }
  }
}
