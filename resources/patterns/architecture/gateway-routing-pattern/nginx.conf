# Gateway Routing Pattern — NGINX as the gateway.
# Serves inside docker-compose.yml on http://localhost:8080
# or standalone with `nginx -c /path/to/nginx.conf`.

events {}

http {
  upstream users_service     { server users-service:8080; }
  upstream orders_service    { server orders-service:8080; }
  upstream inventory_service { server inventory-service:8080; }

  server {
    listen 80;

    # Correlation ID: reuse the client's or mint one.
    set $reqid $http_x_request_id;
    if ($reqid = "") { set $reqid $request_id; }
    proxy_set_header X-Request-ID $reqid;

    location /users     { proxy_pass http://users_service; }
    location /orders    { proxy_pass http://orders_service; }
    location /inventory { proxy_pass http://inventory_service; }

    location /healthz {
      return 200 '{"status":"ok"}';
      add_header Content-Type application/json;
    }
  }
}
