# nginx-stream-ambassador.conf — Nginx stream ambassador for Postgres.
# Raw TCP can't go through Nginx's http {} context; the stream module
# proxies L4 connections. Requires nginx built with --with-stream
# (ngx_stream_module). Load from nginx.conf top level, NOT inside http {}.
stream {
    upstream database_pool {
        server db-primary:5432 max_conns=100;
        server db-replica:5432 max_conns=50 backup;
    }

    server {
        listen 5432;
        proxy_pass database_pool;
        proxy_connect_timeout 5s;
        proxy_timeout 30s;
    }
}
