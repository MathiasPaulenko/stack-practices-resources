# Layered test pipeline: unit -> integration -> e2e.
# Copy to .github/workflows/tests.yml in your project.
name: Test Pyramid

on: [push, pull_request]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:unit  # < 30 seconds

  integration:
    runs-on: ubuntu-latest
    needs: unit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:integration  # < 3 minutes

  e2e:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run build && npm run start &
      # wait-on polls the URL; no fixed sleep that flakes on slow runners
      - run: npx wait-on http://localhost:3000 --timeout 30000
      - run: npm run test:e2e  # < 10 minutes
