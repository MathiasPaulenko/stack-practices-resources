# RabbitMQ configuration for production-like setup.
# See: https://www.rabbitmq.com/configure.html

# Disable default guest user in production
default_user_tags.administrator = false

# Memory watermark (0.4 = 40% of available RAM)
vm_memory_high_watermark.relative = 0.6

# Disk free limit (2GB minimum)
disk_free_limit.absolute = 2000000000

# Enable quorum queues by default
default_queue_type = quorum

# Connection limits
channel_max = 2047

# Heartbeat (seconds)
heartbeat = 60

# Enable management plugin
management.tcp.ip = 0.0.0.0
management.tcp.port = 15672

# TLS configuration (uncomment for production)
# listeners.ssl.default = 5671
# ssl_options.cacertfile = /etc/rabbitmq/ca_certificate.pem
# ssl_options.certfile = /etc/rabbitmq/server_certificate.pem
# ssl_options.keyfile = /etc/rabbitmq/server_key.pem
# ssl_options.verify = verify_peer
# ssl_options.fail_if_no_peer_cert = true
