<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Auto-fit Grid — no media queries</title>
<style>
body { font-family:system-ui,sans-serif; padding:1rem; }
.auto-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr)); gap:1.5rem; }
.card { padding:1.5rem; border-radius:8px; background:#f0f9ff; border:1px solid #bae6fd; }
</style></head><body><div class="auto-grid">
<div class="card">Card 1</div><div class="card">Card 2</div><div class="card">Card 3</div>
<div class="card">Card 4</div><div class="card">Card 5</div><div class="card">Card 6</div>
</div></body></html>
