<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Navbar — Flexbox</title>
<style>
body { margin:0; font-family:system-ui,sans-serif; }
.navbar { display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:0 1.5rem; height:64px; background:#0f172a; color:#fff; }
.logo { font-weight:700; }
.nav-links { display:flex; gap:1rem; list-style:none; margin:0; padding:0; }
.nav-links a { color:#cbd5e1; text-decoration:none; }
.nav-links a:hover { color:#fff; }
.actions { display:flex; gap:.5rem; }
button { padding:.5rem 1rem; border-radius:6px; border:0; }
</style></head><body><nav class="navbar">
<span class="logo">Acme</span>
<ul class="nav-links"><li><a href="#">Docs</a></li><li><a href="#">Pricing</a></li><li><a href="#">Blog</a></li></ul>
<div class="actions"><button>Sign in</button><button>Start free</button></div>
</nav></body></html>
