# CDN cache header matrix by content type.
# Source: https://stackpractices.com/guides/complete-guide-cdn-caching-strategy/

# Static assets: long cache, immutable (use fingerprinted filenames)
location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# HTML pages: short cache, must revalidate
location ~* \.html$ {
    add_header Cache-Control "public, max-age=60, must-revalidate";
}

# API responses: no cache by default
location /api/ {
    add_header Cache-Control "no-store";
}

# Public API responses: short cache
location /api/public/ {
    add_header Cache-Control "public, max-age=60";
}
