# Security headers + hardening snippet for nginx.
# Drop into a server {} block or include from a shared conf.
# Covers OWASP A05 (misconfiguration) and supports the CSP backstop for A03.

# Standard header set — align CSP with your app's real needs
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Only the methods you actually use
limit_except GET POST {
    deny all;
}

# Don't advertise internals in errors
server_tokens off;

# Redirect everything plain HTTP -> HTTPS elsewhere:
#   listen 80;
#   return 301 https://$host$request_uri;
