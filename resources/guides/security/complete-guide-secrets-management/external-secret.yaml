# External Secrets Operator: sync AWS Secrets Manager -> K8s Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-credentials
  data:
    - secretKey: username
      remoteRef:
        key: myapp/db
        property: username
    - secretKey: password
      remoteRef:
        key: myapp/db
        property: password
