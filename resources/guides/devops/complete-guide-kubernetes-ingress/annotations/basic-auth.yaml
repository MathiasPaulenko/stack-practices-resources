# Basic auth on ingress-nginx.
#
# 1. Create the htpasswd file and the secret first:
#    htpasswd -c auth admin
#    kubectl create secret generic basic-auth --from-file=auth -n my-namespace
#
# 2. Reference the secret from the Ingress:
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: protected-ingress
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required"
spec:
  ingressClassName: nginx
  rules:
    - host: admin.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  number: 80
