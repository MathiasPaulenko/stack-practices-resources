# ClusterIssuer for Let's Encrypt via cert-manager (HTTP-01 solver).
# Requires cert-manager installed: helm install cert-manager jetstack/cert-manager --set crds.enabled=true
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@example.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
