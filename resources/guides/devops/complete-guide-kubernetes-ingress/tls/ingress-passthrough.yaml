# TLS passthrough — the backend keeps its cert end-to-end.
# ingress-nginx only honors this when the controller was started with
# --enable-ssl-passthrough (off by default). You lose L7 routing on this host:
# the controller can't inspect encrypted traffic.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: passthrough-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: secure.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: secure-service
                port:
                  number: 443
