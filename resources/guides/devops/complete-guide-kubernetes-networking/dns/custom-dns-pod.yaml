# Pod with custom DNS: bypasses cluster DNS entirely (dnsPolicy: None)
# and sets its own resolvers, search domains, and ndots.
# ndots: 5 means names with fewer than five dots expand against every
# search domain first — use a trailing dot (name.tld.) for external FQDNs.
apiVersion: v1
kind: Pod
metadata:
  name: custom-dns-pod
spec:
  dnsPolicy: None
  dnsConfig:
    nameservers:
      - 8.8.8.8
      - 1.1.1.1
    searches:
      - stackpractices.com
      - production.svc.cluster.local
    options:
      - name: ndots
        value: "5"
  containers:
    - name: app
      image: myapp:latest
