apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
data:
  service.slack: |
    token: $slack-token
  trigger.on-deployed: |
    - when: app.status.operationState.phase in ['Succeeded']
      send: [app-deployed]
  trigger.on-sync-failed: |
    - when: app.status.operationState.phase in ['Error', 'Failed']
      send: [app-sync-failed]
  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [app-health-degraded]
  template.app-deployed: |
    message: |
      {{.app.metadata.name}} deployed — sync status: {{.app.status.sync.status}}
  template.app-sync-failed: |
    message: |
      {{.app.metadata.name}} sync FAILED — check https://argocd.example.com/applications/{{.app.metadata.name}}
  template.app-health-degraded: |
    message: |
      {{.app.metadata.name}} is degraded — health: {{.app.status.health.status}}
