apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: production
  annotations:
    configmap.reloader.stakater.com/reload: "app-config"
    secret.reloader.stakater.com/reload: "app-secrets"
spec:
  replicas: 1
  selector:
    matchLabels: {app: app}
  template:
    metadata:
      labels: {app: app}
    spec:
      containers:
        - name: app
          image: nginx:alpine
          envFrom:
            - configMapRef: {name: app-config, optional: false}
          volumeMounts:
            - name: secret-volume
              mountPath: /etc/secrets
              readOnly: true
      volumes:
        - name: secret-volume
          secret: {secretName: app-secrets, defaultMode: 0400}
