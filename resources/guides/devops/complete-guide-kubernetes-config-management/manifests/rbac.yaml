apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: app-secrets-reader, namespace: production}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["app-secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: app-secrets-reader, namespace: production}
subjects:
  - kind: ServiceAccount
    name: app
    namespace: production
roleRef: {kind: Role, name: app-secrets-reader, apiGroup: rbac.authorization.k8s.io}
