# Prometheus scrape config for the observability lab.
# Scrapes the OTel Collector's Prometheus exporter (port 8889).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yaml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
