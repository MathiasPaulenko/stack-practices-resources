# Prometheus alerting rules: symptom-based alerts + SLO burn rate.
# Companion to stackpractices.com/guides/logging-monitoring-observability-guide/

groups:
  - name: api_alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          runbook: "https://wiki.example.com/runbooks/high-error-rate"

      - alert: HighLatencyP99
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[10m])) > 1
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "p99 latency above 1s on {{ $labels.service }}"

      - alert: SloBurnRateFast
        expr: rate(http_requests_total{status=~"5.."}[1h]) > 14.4 * 0.001
        labels:
          severity: critical
        annotations:
          summary: "Fast SLO burn: error budget gone in ~2h"

      - alert: SloBurnRateSlow
        expr: rate(http_requests_total{status=~"5.."}[6h]) > 2 * 0.001
        labels:
          severity: warning
        annotations:
          summary: "Slow SLO burn: chronic reliability issue"

      - alert: ThroughputDrop
        expr: rate(http_requests_total[5m]) < 5000
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "Throughput below 5K/s — possible upstream outage"
