# docker-compose.test.yml — CI / integration test environment
# docker compose -f docker-compose.yml -f docker-compose.test.yml up \
#   --abort-on-container-exit --exit-code-from backend
services:
  backend:
    build:
      dockerfile: Dockerfile.test
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgres://postgres:postgres@db:5432/app_test
    command: ["npm", "run", "test:integration"]

  db:
    environment:
      POSTGRES_DB: app_test

  # Keep these out of the test run via a profile nobody passes
  nginx:
    profiles:
      - never
  worker:
    profiles:
      - never
