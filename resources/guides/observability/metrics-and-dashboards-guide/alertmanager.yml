# Alertmanager routing — critical alerts page, warnings go to chat,
# duplicates get grouped and dependent alerts silenced.
route:
  receiver: 'team-pager'
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: false
    - match:
        severity: warning
      receiver: 'slack-warnings'

receivers:
  - name: 'team-pager'
    # fallback receiver — point at your on-call integration
    webhook_configs:
      - url: 'http://localhost:5001/'

  - name: 'pagerduty-critical'
    pagerduty_configs:
      - routing_key: '<PAGERDUTY_ROUTING_KEY>'

  - name: 'slack-warnings'
    slack_configs:
      - api_url: '<SLACK_WEBHOOK_URL>'
        channel: '#alerts-warnings'

inhibit_rules:
  # When the service is down, silence its symptom alerts.
  - source_match:
      alertname: 'ServiceDown'
    target_match:
      severity: 'critical'
    equal: ['service']
