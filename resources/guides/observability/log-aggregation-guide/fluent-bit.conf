# Fluent Bit: tail app logs, tag them, ship to Loki with labels.
# Mirrors the "agent per node" topology from the guide.

[SERVICE]
    Flush        2
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name         tail
    Tag          app.*
    Path         /var/log/app/*.log
    Parser       docker
    DB           /var/log/flb-state/tail.db
    Refresh_Interval 2

[FILTER]
    Name         record_modifier
    Match        app.*
    Record       service demo-service
    Record       environment local

[OUTPUT]
    Name         loki
    Match        app.*
    Host         loki
    Port         3100
    Labels       job=fluentbit,service=$service,environment=$environment
    Retry_Limit  10
