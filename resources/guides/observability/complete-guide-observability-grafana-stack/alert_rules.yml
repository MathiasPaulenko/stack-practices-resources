# alert_rules.yml — error-rate + burn-rate alerts
groups:
  - name: api
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
              / sum(rate(http_requests_total[5m])) by (service) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Error rate >5% on {{ $labels.service }}"

      - alert: FastErrorBudgetBurn
        expr: sum(rate(http_requests_total{status=~"5.."}[1h])) by (service)
              / sum(rate(http_requests_total[1h])) by (service) > 0.05 * (1 - 0.999) * 14.4 / 0.0005
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Fast burn of error budget on {{ $labels.service }}"
