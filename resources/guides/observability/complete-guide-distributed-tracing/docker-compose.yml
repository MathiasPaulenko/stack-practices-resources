# docker-compose.yml — Jaeger + Zipkin + OTel Collector lab for development
version: "3.8"
services:
  jaeger:
    image: jaegertracing/all-in-one:1.57
    ports:
      - "16686:16686"   # Jaeger UI
      - "14250:14250"   # gRPC
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  zipkin:
    image: openzipkin/zipkin:3.4
    ports:
      - "9411:9411"     # Zipkin UI and API
    environment:
      - STORAGE_TYPE=mem  # Use elasticsearch for production

  otel-collector:
    image: otel/opentelemetry-collector:0.110.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "14317:4317"    # OTLP gRPC (exposed on 14317 to avoid clash with Jaeger)
      - "14318:4318"    # OTLP HTTP
    depends_on:
      - jaeger
      - zipkin
