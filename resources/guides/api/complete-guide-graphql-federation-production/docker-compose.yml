# Managed federation: the router polls Apollo Uplink for the supergraph.
# APOLLO_KEY and APOLLO_GRAPH_REF are the only variables required.
services:
  router:
    image: ghcr.io/apollographql/router:v1.40.0
    environment:
      - APOLLO_KEY=service:my-graph:YOUR_KEY
      - APOLLO_GRAPH_REF=my-graph@production
    ports:
      - "4000:4000"   # GraphQL endpoint
      - "8088:8088"   # health check (/health)
    volumes:
      - ./router.yaml:/config/router.yaml:ro
