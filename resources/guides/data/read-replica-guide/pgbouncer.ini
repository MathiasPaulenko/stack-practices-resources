# pgbouncer.ini — each backend exposed as a database alias;
# the app picks one per query (writes -> master, reads -> replicaN).

[databases]
master = host=master.db.internal port=5432 dbname=app
replica1 = host=replica1.db.internal port=5432 dbname=app
replica2 = host=replica2.db.internal port=5432 dbname=app

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 25

# App-side routing example (psycopg2):
#   write -> psycopg2.connect("postgresql://u:p@pgbouncer:6432/master")
#   read  -> psycopg2.connect(f"postgresql://u:p@pgbouncer:6432/{replica}")
