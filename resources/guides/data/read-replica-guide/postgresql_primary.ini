# postgresql.conf — Primary: streaming replication settings
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1024
archive_mode = on
archive_command = 'cp %p /var/lib/postgresql/archive/%f'
hot_standby = on

# pg_hba.conf — allow replication connections from the replica subnet
# host replication replicator 192.168.1.0/24 scram-sha-256

# Bootstrap a replica:
# pg_basebackup -h primary-host -D /var/lib/postgresql/data -U replicator -P -v -R
