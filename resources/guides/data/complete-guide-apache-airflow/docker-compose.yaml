# Minimal Airflow dev stack — official quickstart layout
# Usage: docker compose up -d && open http://localhost:8080 (user: airflow / pass: airflow)
# Put the dags/*.py files under ./dags before starting.
version: "3.8"
services:
  airflow-init:
    image: apache/airflow:2.10.5
    entrypoint: ["airflow", "db", "init"]
    environment: &env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: dev-only-change-me
      AIRFLOW__CORE__AUTH_MANAGER: airflow.auth.managers.simple.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: airflow:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS: airflow
    user: "0:0"
    volumes: ["./logs:/opt/airflow/logs", "./dags:/opt/airflow/dags"]

  postgres:
    image: postgres:16
    environment: {POSTGRES_USER: airflow, POSTGRES_PASSWORD: airflow, POSTGRES_DB: airflow}
    volumes: ["pgdata:/var/lib/postgresql/data"]

  scheduler:
    image: apache/airflow:2.10.5
    depends_on: [postgres, airflow-init]
    environment: *env
    volumes: ["./dags:/opt/airflow/dags", "./logs:/opt/airflow/logs"]

  webserver:
    image: apache/airflow:2.10.5
    depends_on: [postgres, airflow-init]
    environment: *env
    ports: ["8080:8080"]
    volumes: ["./dags:/opt/airflow/dags", "./logs:/opt/airflow/logs"]

volumes:
  pgdata:
