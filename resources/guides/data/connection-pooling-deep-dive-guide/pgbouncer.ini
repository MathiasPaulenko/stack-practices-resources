; PgBouncer configuration — transaction pooling for a production fleet.
; See https://stackpractices.com/guides/connection-pooling-deep-dive-guide/

[databases]
app_db = host=primary.db port=5432 dbname=app

[pgbouncer]
listen_port = 6432
; Bind to the app network segment, not the internet.
listen_addr = 127.0.0.1
auth_type = scram-sha-256
; Generate from pg_authid — do not hand-write passwords here.
auth_file = /etc/pgbouncer/userlist.txt

; Pool modes:
; session = connection pinned until client disconnects (default, safest)
; transaction = returned to the pool after each transaction (best sharing)
; statement = returned after each statement (most aggressive, rare)
pool_mode = transaction

; Connection limits. default_pool_size is per user+database pair:
; 4 users x 2 databases x 25 = up to 200 server connections.
max_client_conn = 10000
default_pool_size = 25
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 3

; Server-side connection lifecycle.
server_idle_timeout = 600
server_lifetime = 3600
server_connect_timeout = 15

; Admin console: psql -h 127.0.0.1 -p 6432 pgbouncer
; Useful: SHOW POOLS; SHOW STATS; SHOW CLIENTS;
admin_users = pgbouncer_admin
