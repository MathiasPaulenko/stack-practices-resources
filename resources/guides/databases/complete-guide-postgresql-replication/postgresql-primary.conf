# postgresql-primary.conf — streaming replication primary
# Postmaster-context parameters (require restart to change, not reload):
listen_addresses = '*'
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on

# Reloadable (sighup) parameters:
wal_keep_size = 1024          # MB of WAL kept for replicas without slots
max_slot_wal_keep_size = 8192 # backstop: invalidate slots pinning >8GB WAL

# Optional synchronous replication — apply with reload.
# synchronous_commit = on
# synchronous_standby_names = 'FIRST 1 (replica1)'
