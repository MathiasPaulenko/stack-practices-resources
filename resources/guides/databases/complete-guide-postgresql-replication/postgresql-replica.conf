# postgresql-replica.conf — hot standby settings.
# When you bootstrap with `pg_basebackup -R`, standby.signal and
# primary_conninfo are written automatically; keep credentials out of
# the conn string and use ~/.pgpass (mode 0600) instead.
hot_standby = on
hot_standby_feedback = on      # reduce query cancels on the replica
max_standby_streaming_delay = 30s

# primary_conninfo is stored in postgresql.auto.conf by pg_basebackup -R.
# Reference form (password intentionally omitted):
# primary_conninfo = 'host=primary.example.com port=5432 user=replicator application_name=replica1 sslmode=verify-full sslrootcert=/etc/ssl/ca.crt'
# primary_slot_name = 'replica1_slot'
