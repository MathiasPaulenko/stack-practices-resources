# pg_hba.conf — primary side.
# Only the replica subnet may open replication connections, and only
# over SSL with scram-sha-256. Adjust the CIDR to your network.

local   all             all                                   scram-sha-256
host    all             all             127.0.0.1/32          scram-sha-256
host    all             all             172.16.0.0/12         scram-sha-256

hostssl replication     replicator      172.16.0.0/12         scram-sha-256
hostnossl replication   replicator      0.0.0.0/0             reject
