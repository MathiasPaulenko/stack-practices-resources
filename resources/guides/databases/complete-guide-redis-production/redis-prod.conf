# Redis production config — see guide
bind 127.0.0.1 -::1
port 6379
requirepass CHANGE-ME
maxmemory 4gb
maxmemory-policy allkeys-lru
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 900 1
save 300 10
save 60 10000
rename-command FLUSHALL ""
rename-command CONFIG "CONFIG-9f2k-admin"
rename-command KEYS ""
