# 3-node etcd cluster for CAP partition experiments.
# etcd is a PC/EC system in PACELC terms: it needs a quorum (2 of 3 nodes)
# to accept writes. Partition one node and the majority side keeps working;
# partition two and the whole cluster goes read-only — that's CP.
name: cap-theorem-lab

services:
  etcd1:
    image: gcr.io/etcd-development/etcd:v3.5.16
    container_name: etcd1
    networks: [etcdnet]
    ports: ["2379:2379"]
    environment:
      ETCD_NAME: etcd1
      ETCD_INITIAL_CLUSTER: "etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380"
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: cap-lab
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd1:2380

  etcd2:
    image: gcr.io/etcd-development/etcd:v3.5.16
    container_name: etcd2
    networks: [etcdnet]
    ports: ["2380:2379"]
    environment:
      ETCD_NAME: etcd2
      ETCD_INITIAL_CLUSTER: "etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380"
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: cap-lab
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd2:2380

  etcd3:
    image: gcr.io/etcd-development/etcd:v3.5.16
    container_name: etcd3
    networks: [etcdnet]
    ports: ["2381:2379"]
    environment:
      ETCD_NAME: etcd3
      ETCD_INITIAL_CLUSTER: "etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380"
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: cap-lab
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd3:2380

networks:
  etcdnet:
    driver: bridge
