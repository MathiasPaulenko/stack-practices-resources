# CP-side PostgreSQL configuration: synchronous replication.
# Commits wait until at least one standby confirms the WAL write.
# If the primary loses contact with both standbys, commits block
# (or fail) instead of silently becoming asynchronous — that is
# the CP trade-off: consistency over availability.

synchronous_commit = on
synchronous_standby_names = "FIRST 1 (replica1, replica2)"
wal_level = replica
max_wal_senders = 10

# Pair this with a failover manager that has its own consensus
# (Patroni + etcd/Consul/ZooKeeper) so failover does not create
# a split-brain primary.
