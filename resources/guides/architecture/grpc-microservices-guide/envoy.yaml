# envoy.yaml — L7 gRPC load balancer fronting two service instances.
# Companion to: https://stackpractices.com/guides/grpc-microservices-guide/
#
# HTTP/2 connections are long-lived — an L4 balancer would pin every RPC
# from one client to a single pod. Envoy terminates HTTP/2 and balances
# per-RPC, using the grpc.health.v1 check implemented in server.py.

static_resources:
  listeners:
    - name: grpc_listener
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: user_service
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: user_service
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: user_service_grpc }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: user_service_grpc
      connect_timeout: 0.25s
      type: STRICT_DNS
      lb_policy: LEAST_REQUEST
      http2_protocol_options: {}
      health_checks:
        - timeout: 1s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 2
          grpc_health_check: { service_name: userservice.UserService }
      load_assignment:
        cluster_name: user_service_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: user-service-1, port_value: 50051 }
              - endpoint:
                  address:
                    socket_address: { address: user-service-2, port_value: 50051 }
