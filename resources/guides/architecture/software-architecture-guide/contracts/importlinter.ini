[importlinter]
root_package = shop

[importlinter:contract:modules-independent]
name = Modules are independent
type = forbidden
source_modules =
    shop.modules.catalog
    shop.modules.orders
    shop.modules.payments
forbidden_modules =
    shop.modules.catalog.domain
    shop.modules.catalog.application
    shop.modules.catalog.infrastructure
    shop.modules.orders.domain
    shop.modules.orders.application
    shop.modules.orders.infrastructure
    shop.modules.payments.domain
    shop.modules.payments.application
    shop.modules.payments.infrastructure
ignore_imports =
    shop.modules.orders.api -> shop.modules.catalog.api
    shop.modules.payments.api -> shop.modules.orders.api
