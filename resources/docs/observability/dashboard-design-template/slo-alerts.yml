# Prometheus alerting rules for SLO burn-rate monitoring.
# Load as a rule group: prometheus.yml -> rule_files: ["slo-alerts.yml"]
# Replace service="payment" with your service label.

groups:
  - name: slo-burn-rate
    rules:
      # Fast burn: 2% of the error budget consumed in 1 hour.
      - alert: PaymentSLOFastBurn
        expr: |
          (
            sum(rate(http_requests_total{service="payment",status=~"5.."}[1h]))
            /
            sum(rate(http_requests_total{service="payment"}[1h]))
          ) > 0.02
        for: 5m
        labels:
          severity: critical
          service: payment
        annotations:
          summary: "Payment SLO fast burn — 2% budget consumed in 1h"
          runbook: "https://runbooks.example.com/payment-slo-burn"

      # Slow burn: 5% of the error budget consumed in 6 hours.
      - alert: PaymentSLOSlowBurn
        expr: |
          (
            sum(rate(http_requests_total{service="payment",status=~"5.."}[6h]))
            /
            sum(rate(http_requests_total{service="payment"}[6h]))
          ) > 0.005
        for: 30m
        labels:
          severity: warning
          service: payment
        annotations:
          summary: "Payment SLO slow burn — 5% budget consumed in 6h"
          runbook: "https://runbooks.example.com/payment-slo-burn"
