# nginx: deprecation warning headers for a legacy API version.
# RFC 9745 `Deprecation` marks the resource; RFC 8594 `Sunset` gives the
# shutdown date as an HTTP-date. Both are readable by client tooling.

# --- Phase 1: soft/hard warning — serve traffic but announce the sunset ---
location /v1/ {
    add_header Deprecation "true" always;
    add_header Sunset "Thu, 15 Oct 2027 00:00:00 GMT" always;
    add_header Link "<https://docs.example.com/migrate/v1-to-v2>; rel=\"deprecation\"" always;

    proxy_pass http://legacy_api_backend;
}

