# Each YAML document below is a PagerDuty API request body.
# Replace every <...> with an ID from your PagerDuty account before sending it.
# Timeouts are per rule; the first target is notified immediately.
# The final rule's timeout has no effect while num_loops is 0.
escalation_policy:
  type: escalation_policy
  name: "Platform Team - SEV1"
  description: "Example SEV 1 path: L1 primary, backup, team lead, manager, executive"
  num_loops: 0
  escalation_rules:
    - escalation_delay_in_minutes: 5
      targets:
        - id: "<L1_PRIMARY_USER_ID>"
          type: user_reference
    - escalation_delay_in_minutes: 5
      targets:
        - id: "<L1_BACKUP_USER_ID>"
          type: user_reference
    - escalation_delay_in_minutes: 10
      targets:
        - id: "<L2_TEAM_LEAD_USER_ID>"
          type: user_reference
    - escalation_delay_in_minutes: 25
      targets:
        - id: "<L3_ENGINEERING_MANAGER_USER_ID>"
          type: user_reference
    - escalation_delay_in_minutes: 1
      targets:
        - id: "<L4_EXECUTIVE_USER_ID>"
          type: user_reference
---
# SEV 2 profile: L1 at minute 0, backup at 15, L2 at 30, and L3 at 60.
# Delays are 15 + 15 + 30 minutes; the final target is L3.
escalation_policy:
  type: escalation_policy
  name: "Platform Team - SEV2"
  description: "Example SEV 2 path: L1 primary, backup, team lead, manager"
  num_loops: 0
  escalation_rules:
    - escalation_delay_in_minutes: 15
      targets:
        - id: "<L1_PRIMARY_USER_ID>"
          type: user_reference
    - escalation_delay_in_minutes: 15
      targets:
        - id: "<L1_BACKUP_USER_ID>"
          type: user_reference
    - escalation_delay_in_minutes: 30
      targets:
        - id: "<L2_TEAM_LEAD_USER_ID>"
          type: user_reference
    - escalation_delay_in_minutes: 1
      targets:
        - id: "<L3_ENGINEERING_MANAGER_USER_ID>"
          type: user_reference