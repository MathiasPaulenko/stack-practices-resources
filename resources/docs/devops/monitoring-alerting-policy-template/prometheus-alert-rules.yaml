# Prometheus alerting rules implementing the Monitoring & Alerting Policy.
# Severity labels (P1-P5) and team labels drive Alertmanager routing.
# Adapt thresholds to your 90-day baseline before deploying.

groups:
  - name: api_alerts
    interval: 30s
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
          / sum(rate(http_requests_total[5m])) by (service) > 0.05
        for: 2m
        labels:
          severity: P1
          team: platform
        annotations:
          summary: "{{ $labels.service }} error rate > 5%"
          description: "{{ $labels.service }} has {{ $value | humanizePercentage }} error rate for 2 minutes"
          runbook: "https://runbooks.example.com/high-error-rate"

      - alert: ErrorRateElevated
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m])) by (service)
          / sum(rate(http_requests_total[5m])) by (service) > 0.01
        for: 5m
        labels:
          severity: P3
          team: platform
        annotations:
          summary: "{{ $labels.service }} error rate > 1% for 5 minutes"
          runbook: "https://runbooks.example.com/error-rate"

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[10m])) by (le, service)) > 1
        for: 5m
        labels:
          severity: P2
          team: platform
        annotations:
          summary: "{{ $labels.service }} p99 latency > 1s"
          runbook: "https://runbooks.example.com/high-latency"

      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"}
          / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 15m
        labels:
          severity: P2
          team: infrastructure
        annotations:
          summary: "Disk space < 10% on {{ $labels.instance }}"
          runbook: "https://runbooks.example.com/disk-space"

      - alert: CertificateExpirySoon
        expr: probe_ssl_earliest_cert_expiry - time() < 604800
        for: 1h
        labels:
          severity: P2
          team: infrastructure
        annotations:
          summary: "TLS certificate on {{ $labels.instance }} expires in < 7 days"
          runbook: "https://runbooks.example.com/cert-expiry"
